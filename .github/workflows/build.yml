name: Build & Publish

# Dispara ao empurrar uma tag tipo v1.0.3, ou manualmente pela aba Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # necessário pra criar/atualizar o release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build & publish (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Não temos certificado de assinatura — desliga a busca automática
          # (senão o build do macOS falha procurando uma identidade).
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish always
