name: Build & Publish

# Dispara ao empurrar uma tag tipo v1.0.5, ou manualmente (só build, sem release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Fase 1: builda cada sistema e guarda os arquivos (sem publicar)
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (sem publicar)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # sem certificado de assinatura
        run: npx electron-builder --publish never
      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml

  # ── Fase 2: junta tudo e cria UM release (só em tag)
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Criar release (rascunho)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
