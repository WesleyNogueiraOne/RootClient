appId: 'com.rootrp.rootclient'
productName: 'Root Client'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Root RP'

asar: true
compression: 'maximum'

publish:
  provider: 'github'
  owner: 'WesleyNogueiraOne'
  repo: 'RootClient'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}'

extraResources:
  - 'libraries'

# Windows Configuration
win:
  icon: 'app/assets/images/logo.ico'
  target:
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 'Root Client'

# macOS Configuration
mac:
  icon: 'app/assets/images/logo.png'
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux:
  icon: 'app/assets/images/logo.png'
  target: 'AppImage'
  maintainer: 'Root RP'
  vendor: 'Root RP'
  synopsis: 'Launcher do Root RP'
  description: 'Launcher do servidor Root RP. Mods, configurações e atualizações automáticas.'
  category: 'Game'

directories:
  buildResources: 'build'
  output: 'dist'
